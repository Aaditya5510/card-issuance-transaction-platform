services:
  postgres:
    image: postgres:16-alpine
    container_name: card-platform-postgres
    environment:
      POSTGRES_DB: card_platform_db
      POSTGRES_USER: card_user
      POSTGRES_PASSWORD: card_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_user -d card_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
